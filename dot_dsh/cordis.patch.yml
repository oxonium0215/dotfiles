- insert:
    - id: rea-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: rea
        transport: stdio
        command: cmd.exe
        args:
          - /d
          - /c
          - npx
          - -y
          - rea-agents@6.5.0
          - mcp
        env:
          GHIDRA_INSTALL_DIR: C:\tools\ghidra_12.1.4_PUBLIC
          JAVA_HOME: C:\Program Files\Eclipse Adoptium\jdk-21.0.12.101-hotspot
    - id: unity-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: unityMCP
        transport: stdio
        command: "C:\\Users\\yugo\\AppData\\Local\\hermes\\bin\\uvx.exe"
        args:
          - "--from"
          - "mcpforunityserver==10.3.0"
          - "mcp-for-unity"
          - "--transport"
          - "stdio"
    - id: cua-driver-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: cua_driver
        transport: stdio
        command: "C:\\Users\\yugo\\AppData\\Local\\Programs\\Cua\\cua-driver\\bin\\cua-driver.exe"
        args:
          - mcp
          - --socket
          - "\\\\.\\pipe\\cua-driver"
