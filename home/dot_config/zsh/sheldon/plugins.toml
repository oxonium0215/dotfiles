shell = "zsh"

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.zsh-async]
github = "mafredri/zsh-async"

[plugins.z]
github = 'agkozak/zsh-z'
apply = ["defer"]
hooks.pre = '''
export ZSHZ_NO_RESOLVE_SYMLINKS=1
'''

[plugins.bd]
github = 'Tarrasch/zsh-bd'
use = ['bd.zsh']
apply = ["defer"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
apply = ["defer"]
hooks.pre = '''
export ZSH_AUTOSUGGEST_USE_ASYNC=1
export ZSH_AUTOSUGGEST_MANUAL_REBIND=1
export ZSH_AUTOSUGGEST_BUFFER_MAX_SIZE=20
export ZSH_AUTOSUGGEST_HISTORY_IGNORE="(cd *|ls *|la *|ll *|l *|exit|clear)"
typeset -ga ZSH_AUTOSUGGEST_CLEAR_WIDGETS=(
    history-search-forward
    history-search-backward
    history-beginning-search-forward
    history-beginning-search-backward
    history-beginning-search-forward-end
    history-beginning-search-backward-end
    history-substring-search-up
    history-substring-search-down
    up-line-or-beginning-search
    down-line-or-beginning-search
    up-line-or-history
    down-line-or-history
    accept-line
    copy-earlier-word
    expand-or-complete
    expand-or-complete-prefix
    complete-word
    menu-complete
    menu-expand-or-complete
    reverse-menu-complete
    list-choices
)
'''
hooks.post = '''
zsh-defer -c 'autoload -Uz add-zsh-hook; add-zsh-hook -d precmd _zsh_autosuggest_start 2>/dev/null || true'
'''

